<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: flow tabs on top, diagram canvas + step panel side by side (stacked on phones), optional static section below */
:root {
  --bg: #f5f6f8; --panel: #ffffff; --fg: #1b2330; --muted: #5a6577; --line: #d6dce5; --faint: #c3cad5;
  --accent: #1f6feb; --warn: #b45309; --warn-bg: #fff4e3;
  --k-user: #7c3aed; --k-svc: #1f6feb; --k-alt: #0e7490; --k-ext: #7c8aa0; --k-db: #0f9d76; --k-job: #c26a0a; --k-log: #c2410c;
  --sans: "Noto Sans TC", system-ui, "Microsoft JhengHei", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10141a; --panel: #171d25; --fg: #e3e8ef; --muted: #97a2b3; --line: #2a333f; --faint: #3a4552;
  --accent: #6ea8ff; --warn: #f0b35a; --warn-bg: #2a2014;
  --k-user: #b392f0; --k-svc: #6ea8ff; --k-alt: #4cc3d9; --k-ext: #8f9cb0; --k-db: #3fcf9f; --k-job: #f0a34a; --k-log: #ff8a5c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10141a; --panel: #171d25; --fg: #e3e8ef; --muted: #97a2b3; --line: #2a333f; --faint: #3a4552;
  --accent: #6ea8ff; --warn: #f0b35a; --warn-bg: #2a2014;
  --k-user: #b392f0; --k-svc: #6ea8ff; --k-alt: #4cc3d9; --k-ext: #8f9cb0; --k-db: #3fcf9f; --k-job: #f0a34a; --k-log: #ff8a5c; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; }
h1 { font-size: 1.85rem; margin: 0; text-wrap: balance; }
h2 { font-size: 1.2rem; margin: 0; text-wrap: balance; }
p { margin: 0; max-width: 72ch; }
.lede { color: var(--muted); }
code { font-family: var(--mono); font-size: .86em; background: color-mix(in srgb, var(--accent) 10%, transparent); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
section { display: grid; gap: 12px; min-width: 0; }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { font: inherit; font-size: .92rem; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.tab:hover { border-color: var(--accent); }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 500; }
.tab:focus-visible, .btn:focus-visible, .steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.flowhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
.flowdesc { color: var(--muted); }
.status { font-size: .78rem; padding: 1px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.status.live { border-color: var(--k-db); color: var(--k-db); }
.status.plan { border-color: var(--warn); color: var(--warn); }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.canvas { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; overflow-x: auto; }
.canvas svg { display: block; width: 100%; min-width: 640px; height: auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.counter { font-family: var(--mono); font-size: .82rem; color: var(--muted); letter-spacing: .04em; }
.panel h3 { margin: 0; font-size: 1.08rem; text-wrap: balance; }
.panel .body { color: var(--fg); font-size: .95rem; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; }
.refs code { font-size: .78rem; }
.warnbox { background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); color: var(--fg);
  border-radius: 8px; padding: 8px 12px; font-size: .9rem; }
.warnbox strong { color: var(--warn); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: inherit; font-size: .9rem; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 500; }
.btn:disabled { opacity: .45; cursor: default; }
.hint { color: var(--muted); font-size: .8rem; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; border-top: 1px solid var(--line); padding-top: 10px; }
.steps button { width: 100%; text-align: left; font: inherit; font-size: .88rem; background: none; border: 0; color: var(--muted);
  padding: 4px 8px; border-radius: 6px; cursor: pointer; display: grid; grid-template-columns: 1.6em 1fr; gap: 6px; }
.steps button:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.steps button.done { color: var(--fg); }
.steps button.cur { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--fg); font-weight: 500; }
.steps .n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.steps .w { color: var(--warn); }

.node rect { fill: var(--panel); stroke: var(--faint); stroke-width: 1.5; }
.node .t { fill: var(--fg); font: 500 13px var(--sans); }
.node .s { fill: var(--muted); font: 10.5px var(--mono); }
.node .bar { stroke: none; }
.node.idle { opacity: .55; }
.node.seen rect { stroke: var(--line); }
.node.active rect { stroke: var(--accent); stroke-width: 2.5; }
.edge path { fill: none; stroke-width: 1.6; }
.edge.todo path { stroke: var(--faint); stroke-dasharray: 4 5; }
.edge.done path { stroke: var(--muted); }
.edge.cur path { stroke: var(--accent); stroke-width: 2.8; }
.badge circle { stroke-width: 1.5; }
.edge.todo .badge circle { fill: var(--panel); stroke: var(--faint); }
.edge.done .badge circle { fill: var(--panel); stroke: var(--muted); }
.edge.cur .badge circle { fill: var(--accent); stroke: var(--accent); }
.badge text { font: 500 10.5px var(--mono); text-anchor: middle; dominant-baseline: central; fill: var(--muted); }
.edge.cur .badge text { fill: var(--panel); }
.elabel { font: 500 12px var(--sans); fill: var(--accent); paint-order: stroke; stroke: var(--panel); stroke-width: 5px; stroke-linejoin: round; }
.packet { fill: var(--accent); }
.ah-todo { fill: var(--faint); } .ah-done { fill: var(--muted); } .ah-cur { fill: var(--accent); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: .84rem; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.diagram { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow-x: auto; }
.diagram pre.mermaid { margin: 0; min-width: 760px; background: transparent; }
details.ov { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
details.ov summary { cursor: pointer; font-weight: 500; }
details.ov[open] summary { margin-bottom: 10px; }
footer { color: var(--muted); font-size: .84rem; border-top: 1px solid var(--line); padding-top: 12px; }
@media (prefers-reduced-motion: reduce) { .packet { display: none; } }
</style>

<div class="wrap">
  <header style="display:grid;gap:8px">
    <h1>{{HEADING}}</h1>
    <p class="lede">{{LEDE}}</p>
  </header>

  <section aria-label="資料流逐步說明">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="flowhead"><span class="status" id="flowstatus" hidden></span><p class="flowdesc" id="flowdesc"></p></div>
    <div class="legend" id="legend"></div>
    <div class="stage">
      <div class="canvas"><svg id="svg" role="img" aria-label="資料流圖"></svg></div>
      <div class="panel" aria-live="polite">
        <div class="controls">
          <button class="btn" id="prev">← 上一步</button>
          <button class="btn primary" id="next">下一步 →</button>
          <span class="hint">鍵盤 ← →</span>
        </div>
        <div class="counter" id="counter"></div>
        <h3 id="stitle"></h3>
        <div class="body" id="sbody"></div>
        <div class="warnbox" id="swarn" hidden></div>
        <div class="refs" id="srefs"></div>
        <ol class="steps" id="steps"></ol>
      </div>
    </div>
  </section>

<!--STATIC-START-->
<!--STATIC-END-->

  <footer>{{FOOTER}}</footer>
</div>

<script>
/*PAGE-START*/
const PAGE = {
  kinds: { user: '人', svc: '自家服務', ext: '外部系統', db: '資料庫／快取', job: '排程 Job', log: '資料丟失（只記 log）' },
};
const FLOWS = [
  {
    id: 'example', name: '範例', status: 'live', vb: [1050, 300],
    desc: '把這段換成真正的資料流。',
    nodes: [
      { id: 'A', x: 90, y: 150, t: '來源', s: 'source', k: 'ext' },
      { id: 'B', x: 320, y: 150, t: '服務', s: 'service', k: 'svc' },
      { id: 'C', x: 560, y: 150, t: '資料庫', s: 'table', k: 'db' },
    ],
    steps: [
      { f: 'A', to: 'B', l: '送出', title: '來源送出資料', body: '說明。', refs: ['path/file.cs:12'] },
      { f: 'B', to: 'C', l: '寫入', title: '寫進資料庫', body: '說明。', warn: '容易出事的地方。' },
    ],
  },
];
/*PAGE-END*/

const W = 160, H = 56;
const STATUS = { live: ['現行', 'live'], plan: ['設計中', 'plan'] };
const $ = id => document.getElementById(id);
const svg = $('svg');
const NS = 'http://www.w3.org/2000/svg';
let fi = 0, si = 0;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function clip(c, toward) {
  const dx = toward.x - c.x, dy = toward.y - c.y;
  const t = Math.min((W / 2 + 6) / Math.abs(dx || 1e-9), (H / 2 + 6) / Math.abs(dy || 1e-9));
  return { x: c.x + dx * t, y: c.y + dy * t };
}
function geom(a, b, bend) {
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
  const c = { x: mx - dy / len * (bend || 0) * 2, y: my + dx / len * (bend || 0) * 2 };
  const p1 = clip(a, c), p2 = clip(b, c);
  const mid = { x: .25 * p1.x + .5 * c.x + .25 * p2.x, y: .25 * p1.y + .5 * c.y + .25 * p2.y };
  return { d: `M${p1.x},${p1.y} Q${c.x},${c.y} ${p2.x},${p2.y}`, mid };
}

function draw() {
  const flow = FLOWS[fi];
  const byId = Object.fromEntries(flow.nodes.map(n => [n.id, n]));
  svg.setAttribute('viewBox', `0 0 ${flow.vb[0]} ${flow.vb[1]}`);
  svg.innerHTML = '';
  const defs = el('defs', {}, svg);
  ['todo', 'done', 'cur'].forEach(s => {
    const m = el('marker', { id: 'ah-' + s, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
    el('path', { d: 'M0,0 L10,5 L0,10 z', class: 'ah-' + s }, m);
  });
  const cur = flow.steps[si];
  const active = new Set([cur.f, cur.to]);
  const seen = new Set();
  flow.steps.slice(0, si).forEach(s => { seen.add(s.f); seen.add(s.to); });
  const gEdges = el('g', {}, svg), gNodes = el('g', {}, svg), gTop = el('g', {}, svg);
  let curMid = null;
  flow.steps.forEach((s, i) => {
    const state = i < si ? 'done' : i === si ? 'cur' : 'todo';
    const g = el('g', { class: 'edge ' + state }, i === si ? gTop : gEdges);
    const { d, mid } = geom(byId[s.f], byId[s.to], s.bend);
    el('path', { d, id: 'e' + i, 'marker-end': `url(#ah-${state})` }, g);
    const bg = el('g', { class: 'badge', transform: `translate(${mid.x},${mid.y})`, style: 'cursor:pointer' }, g);
    el('circle', { r: 10 }, bg);
    el('text', {}, bg).textContent = i + 1;
    bg.addEventListener('click', () => go(i));
    if (i === si) curMid = mid;
  });
  flow.nodes.forEach(n => {
    const state = active.has(n.id) ? 'active' : seen.has(n.id) ? 'seen' : 'idle';
    const g = el('g', { class: 'node ' + state, transform: `translate(${n.x - W / 2},${n.y - H / 2})` }, gNodes);
    el('rect', { width: W, height: H, rx: 8 }, g);
    el('rect', { class: 'bar', width: 5, height: H - 16, x: 0, y: 8, rx: 2, style: `fill:var(--k-${n.k})` }, g);
    el('text', { class: 't', x: 14, y: 23 }, g).textContent = n.t;
    el('text', { class: 's', x: 14, y: 41 }, g).textContent = n.s || '';
  });
  if (cur.l) el('text', { class: 'elabel', x: curMid.x, y: curMid.y - 16, 'text-anchor': 'middle' }, gTop).textContent = cur.l;
  if (!reduced) {
    const pk = el('circle', { r: 5, class: 'packet' }, gTop);
    const am = el('animateMotion', { dur: '1.3s', repeatCount: 'indefinite' }, pk);
    el('mpath', { href: '#e' + si }, am);
  }
}

function panel() {
  const flow = FLOWS[fi], s = flow.steps[si];
  $('counter').textContent = `步驟 ${si + 1} / ${flow.steps.length}`;
  $('stitle').textContent = s.title;
  $('sbody').innerHTML = s.body || '';
  $('sbody').hidden = !s.body;
  const w = $('swarn');
  if (s.warn) { w.innerHTML = '<strong>⚠ </strong>' + s.warn; w.hidden = false; } else w.hidden = true;
  $('srefs').innerHTML = (s.refs || []).map(r => `<code>${r}</code>`).join('');
  $('prev').disabled = si === 0;
  $('next').disabled = si === flow.steps.length - 1;
  [...$('steps').querySelectorAll('button')].forEach((b, i) => { b.className = i < si ? 'done' : i === si ? 'cur' : ''; });
}

function buildFlow() {
  const flow = FLOWS[fi];
  $('flowdesc').innerHTML = flow.desc;
  const st = $('flowstatus'), sv = STATUS[flow.status];
  if (sv) { st.textContent = sv[0]; st.className = 'status ' + sv[1]; st.hidden = false; } else st.hidden = true;
  [...$('tabs').children].forEach((b, i) => b.setAttribute('aria-selected', i === fi));
  const used = new Set(flow.nodes.map(n => n.k));
  $('legend').innerHTML = Object.entries(PAGE.kinds).filter(([k]) => used.has(k))
    .map(([k, v]) => `<span style="--c:var(--k-${k})">${v}</span>`).join('');
  $('steps').innerHTML = '';
  flow.steps.forEach((s, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.innerHTML = `<span class="n">${i + 1}</span><span>${s.title}${s.warn ? ' <span class="w">⚠</span>' : ''}</span>`;
    b.addEventListener('click', () => go(i));
    li.appendChild(b); $('steps').appendChild(li);
  });
}

function go(i) { si = Math.max(0, Math.min(i, FLOWS[fi].steps.length - 1)); draw(); panel(); }
function selectFlow(i, keepHash) {
  fi = i; si = 0; buildFlow(); go(0);
  if (!keepHash) { try { history.replaceState(null, '', '#' + FLOWS[i].id); } catch (e) { location.hash = FLOWS[i].id; } }
}
FLOWS.forEach((f, i) => {
  const b = document.createElement('button');
  b.className = 'tab'; b.setAttribute('role', 'tab'); b.textContent = f.name;
  b.addEventListener('click', () => selectFlow(i));
  $('tabs').appendChild(b);
});
$('prev').addEventListener('click', () => go(si - 1));
$('next').addEventListener('click', () => go(si + 1));
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') go(si + 1);
  if (e.key === 'ArrowLeft') go(si - 1);
});
function fromHash() {
  const i = FLOWS.findIndex(f => '#' + f.id === location.hash);
  selectFlow(i >= 0 ? i : 0, true);
}
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
